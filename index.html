[odintsovo, balashikha].forEach(function(zone){
  var layer = L.layerGroup();
  var latlngs = zone.outline || zone.points.map(function(p){ return [p[0], p[1]]; });

  var polygon = L.polygon(latlngs, {
    color: zone.color, weight: 3, fillColor: zone.color, fillOpacity: 0.12
  }).addTo(layer);
  polygon.bindPopup('<div class="popup-title">' + zone.name + '</div>' +
    'Территория с регламентированным посещением для иностранных граждан');

  zone.points.forEach(function(p, i){
    var icon = L.divIcon({
      className: '', html: '<div class="pt-label" style="background:' + zone.color + '">' + (i+1) + '</div>',
      iconSize: [22,22], iconAnchor: [11,11]
    });
    var desc = p[2] ? p[2] : 'промежуточная точка по административной границе / предыдущему описанию';
    L.marker([p[0], p[1]], {icon: icon}).addTo(layer)
      .bindPopup('<div class="popup-title">' + zone.name + ' — точка ' + (i+1) + '</div>' +
        '<div class="popup-coords">' + p[0].toFixed(6) + ' с.ш., ' + p[1].toFixed(6) + ' в.д.</div>' + desc);
  });

  groups.push({name: zone.name, color: zone.color, layer: layer, polygon: polygon});
});

// Зоны доставки (секторы по юнитам); hit = зона пересекает территорию с регламентированным посещением
function zoneStyle(name){
  return delivery[name].hit.length > 0
    ? {color: '#d35400', weight: 2, fillColor: '#e67e22', fillOpacity: 0.30}
    : {color: '#16a085', weight: 1, fillColor: '#1abc9c', fillOpacity: 0.15};
}
var highlightStyle = {color: '#c0392b', weight: 4, fillColor: '#e74c3c', fillOpacity: 0.45};
var zrpFragStyleGlobal = {color: '#ff0000', weight: 2, fillColor: '#ff0000', fillOpacity: 0.55};
var zrpFragHiddenStyle = {stroke: false, fillOpacity: 0};
var highlightedUnit = null;

var deliveryLayer = L.layerGroup();
var unitLayers = {};
Object.keys(delivery).forEach(function(name){
  var g = L.layerGroup();
  var isHit = delivery[name].hit.length > 0;
  var style = zoneStyle(name);
  delivery[name].p.forEach(function(poly){
    L.polygon(poly, style).addTo(g);
  });
  (delivery[name].zp || []).forEach(function(rings){
    var frag = L.polygon(rings, zrpFragHiddenStyle);
    frag.isZrpFrag = true;
    frag.addTo(g);
  });
  var hitInfo = isHit
    ? '<div style="color:#d35400;font-weight:600;margin-top:4px">Зона доставки пересекает территорию с регламентированным посещением: ' + delivery[name].hit.join(', ') + '</div>'
    : '<div style="color:#7f8c8d;margin-top:4px">Не пересекает территорию с регламентированным посещением</div>';
  g.bindPopup('<div class="popup-title">Зона доставки: ' + name + '</div>' +
    'Секторов: ' + delivery[name].p.length + hitInfo);
  g.eachLayer(function(l){ l.addTo(deliveryLayer); });
  unitLayers[name] = g;
});
deliveryLayer.addTo(map);
layerControl.addOverlay(deliveryLayer, 'Сектора (зоны доставки)');

// Раскрывающийся список: юниты, чьи зоны доставки попадают в территории с регламентированным посещением
var hitsList = Object.keys(delivery).filter(function(n){ return delivery[n].hit.length > 0; }).sort();
var zrpControl = L.control({position: 'bottomright'});
zrpControl.onAdd = function(){
  var div = L.DomUtil.create('div', 'legend');
  var html = '<details open><summary style="cursor:pointer;font-weight:600">Зоны доставки в территориях ЗРП (' + hitsList.length + ')</summary><div style="margin-top:6px">';
  hitsList.forEach(function(n){
    html += '<div><a href="#" data-unit="' + n + '" style="color:#d35400">' + n + '</a> <span style="color:#95a5a6;font-size:11px">(' + delivery[n].hit.join(', ') + ')</span></div>';
  });
  html += '</div></details>';
  div.innerHTML = html;
  L.DomEvent.disableClickPropagation(div);
  div.addEventListener('click', function(e){
    var a = e.target.closest('a[data-unit]');
    if(!a) return;
    e.preventDefault();
    var name = a.dataset.unit;
    if(highlightedUnit && highlightedUnit !== name){
      var zs = zoneStyle(highlightedUnit);
      unitLayers[highlightedUnit].eachLayer(function(l){ l.setStyle(l.isZrpFrag ? zrpFragHiddenStyle : zs); });
    }
    var g = unitLayers[name];
    g.eachLayer(function(l){ l.setStyle(l.isZrpFrag ? zrpFragStyleGlobal : highlightStyle); l.bringToFront(); });
    highlightedUnit = name;
    div.querySelectorAll('a[data-unit]').forEach(function(x){ x.style.fontWeight = x === a ? '700' : '400'; });
    if(!map.hasLayer(deliveryLayer)) deliveryLayer.addTo(map);
    map.fitBounds(g.getBounds().pad(0.15));
    g.openPopup(g.getBounds().getCenter());
  });
  return div;
};
zrpControl.addTo(map);


var bounds = L.latLngBounds([]);
groups.forEach(function(g){ bounds.extend(g.polygon.getBounds()); });
pizzerias.forEach(function(u){ bounds.extend(u.ll); });
map.fitBounds(bounds.pad(0.15));
L.control.scale({imperial: false}).addTo(map);

// Легенда с кликабельным зумом к зонам
var legend = L.control({position: 'topright'});
legend.onAdd = function(){
  var div = L.DomUtil.create('div', 'legend');
  var html = '<h4>Территории с регламентированным посещением</h4>';
  groups.forEach(function(g, i){
    html += '<div><span class="sw" style="background:' + g.color + '"></span>' +
      '<a href="#" data-zone="' + i + '" style="color:#2c3e50">' + g.name + '</a></div>';
  });
  html += '<div class="note">Разрешён транзитный проезд по М-1 «Беларусь», 1-му Успенскому ш., Красногорскому ш., ' +
    'М-7 «Волга», М-12 «Восток», 46К-7011 (Носовихинское ш.), 46К-7470 (Восточное ш.), ' +
    '46К-7090 (Разинское ш.), Леоновскому ш., а также по МЖД (Горьковское направление).</div>';
  div.innerHTML = html;
  L.DomEvent.disableClickPropagation(div);
  div.addEventListener('click', function(e){
    var a = e.target.closest('a[data-zone]');
    if(!a) return;
    e.preventDefault();
    map.fitBounds(groups[+a.dataset.zone].polygon.getBounds().pad(0.1));
  });
  return div;
};
legend.addTo(map);
});
</script>
